<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이미지 분석 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* 다크 모드 테마 설정 */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #bb86fc;
            margin-bottom: 25px;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* 이미지 미리보기 영역 */
        #previewContainer {
            width: 100%;
            height: 300px;
            border: 2px dashed #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #252525;
        }

        #previewImg {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: bold;
            color: #999;
        }

        .model-selector {
            display: flex;
            gap: 15px;
            background: #2c2c2c;
            padding: 10px;
            border-radius: 6px;
        }

        .model-selector label {
            color: #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        textarea {
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 6px;
            resize: none;
            height: 80px;
        }

        button {
            background-color: #03dac6;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { background-color: #018786; }
        button:disabled { background-color: #555; cursor: not-allowed; }

        /* 로딩 애니메이션 */
        .loading {
            display: none;
            margin: 20px 0;
            text-align: center;
            color: #03dac6;
            animation: pulse 1.5s infinite;
        }
  /* 결과 표시 창 */
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }

        #resultArea {
            margin-top: 25px;
            padding: 20px;
            background: #2c2c2c;
            border-left: 4px solid #bb86fc;
            border-radius: 4px;
            display: none;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        .result-title {
            font-weight: bold;
            color: #bb86fc;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI 이미지 분석기</h1>

        <div class="upload-section">
            <div id="previewContainer">
                <span id="placeholderText">이미지를 선택해주세요</span>
                <img id="previewImg" src="" alt="미리보기">
            </div>

            <div class="input-group">
                <label>이미지 파일</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="input-group">
                <label>분석 모델 선택</label>
                <div class="model-selector">
                    <label><input type="radio" name="modelSelect" value="OLLAMA" checked> Ollama (일반)</label>
                    <label><input type="radio" name="modelSelect" value="CHANDRA"> Chandra (OCR)</label>
                    <label><input type="radio" name="modelSelect" value="GPT"> GPT-4o (고성능)</label>
                </div>
            </div>

            <div class="input-group">
                <label>질문 및 요청사항</label>
                <textarea id="questionInput" placeholder="예: 이 문서의 내용을 요약해줘 / 표 형식으로 추출해줘"></textarea>
            </div>

            <button id="analyzeBtn" onclick="requestAnalysis()">분석하기</button>
        </div>

        <div id="loading" class="loading">AI가 분석 중입니다... 잠시만 기다려주세요.</div>

        <div id="resultArea">
            <div class="result-title">분석 결과:</div>
            <div id="resultText"></div>
        </div>
    </div>

    <script>
        // 이미지 미리보기 기능
        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.getElementById('previewImg');
                    img.src = event.target.result;
                    img.style.display = 'block';
                    document.getElementById('placeholderText').style.display = 'none';
                };
                reader.readAsDataURL(file);
            }
        });

        /**
         * 분석 요청을 처리하는 함수입니다.
         * 가이드에 따라 명확한 주석을 작성합니다.
         */
        async function requestAnalysis() {
            const imageInput = document.getElementById('imageInput');
            const questionInput = document.getElementById('questionInput');
            const model = document.querySelector('input[name="modelSelect"]:checked').value;
            const btn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');
            const resultText = document.getElementById('resultText');

            if (!imageInput.files[0]) {
                alert('이미지를 선택해주세요.');
                return;
            }

            // UI 상태 제어
            btn.disabled = true;
            loading.style.display = 'block';
            resultArea.style.display = 'none';

            const formData = new FormData();
            formData.append('image', imageInput.files[0]);
            formData.append('question', questionInput.value);
            formData.append('model', model);

            try {
                // Node.js 프록시 서버를 통해 FastAPI 호출
                const response = await axios.post('/analyze', formData);
                
                resultArea.style.display = 'block';
                if (response.data.success) {
                    resultText.innerText = response.data.answer;
                } else {
                    resultText.innerText = "에러: " + response.data.message;
                }
            } catch (error) {
                alert('통신 오류가 발생했습니다.');
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
