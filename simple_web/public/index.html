<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 이미지 분석 시스템</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <style>
        /* 다크 모드 테마 설정 */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            text-align: center;
            color: #bb86fc;
        }

        .upload-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 이미지 미리보기 영역 */
        #previewContainer {
            width: 100%;
            height: 300px;
            border: 2px dashed #333;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #252525;
        }

        #previewImg {
            max-width: 100%;
            max-height: 100%;
            display: none;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="file"] {
            color: #999;
        }

        textarea {
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            padding: 12px;
            border-radius: 6px;
            resize: none;
            height: 100px;
        }

        button {
            background-color: #03dac6;
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #018786;
        }

        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        /* 로딩 애니메이션 */
        .loading {
            display: none;
            margin: 20px 0;
            text-align: center;
            color: #03dac6;
            font-style: italic;
        }

        /* 결과 표시 창 */
        #resultArea {
            margin-top: 25px;
            padding: 20px;
            background: #2c2c2c;
            border-left: 4px solid #bb86fc;
            border-radius: 4px;
            display: none;
            white-space: pre-wrap;
        }

        .result-title {
            font-weight: bold;
            color: #bb86fc;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>AI 이미지 분석기</h1>

        <div class="upload-section">
            <div id="previewContainer">
                <span id="placeholderText">이미지를 선택해주세요</span>
                <img id="previewImg" src="" alt="미리보기">
            </div>

            <div class="input-group">
                <label>이미지 선택</label>
                <input type="file" id="imageInput" accept="image/*">
            </div>

            <div class="input-group">
                <label>질문 입력</label>
                <textarea id="questionInput" placeholder="이미지에 대해 궁금한 점을 물어보세요..."></textarea>
            </div>

            <button id="analyzeBtn" onclick="requestAnalysis()">분석하기</button>
        </div>

        <div id="loading" class="loading">AI가 분석 중입니다... 잠시만 기다려주세요.</div>

        <div id="resultArea">
            <div class="result-title">분석 결과:</div>
            <div id="resultText"></div>
        </div>
    </div>

    <script>
        /**
         * 이미지 선택 시 미리보기 표시
         */
        document.getElementById('imageInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            const previewImg = document.getElementById('previewImg');
            const placeholder = document.getElementById('placeholderText');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    previewImg.src = e.target.result;
                    previewImg.style.display = 'block';
                    placeholder.style.display = 'none';
                }
                reader.readAsDataURL(file);
            }
        });

        /**
         * Node.js 서버로 분석 요청 전송
         */
        async function requestAnalysis() {
            const imageInput = document.getElementById('imageInput');
            const questionInput = document.getElementById('questionInput');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');
            const resultText = document.getElementById('resultText');

            if (!imageInput.files[0]) {
                alert('이미지를 먼저 선택해주세요!');
                return;
            }

            // UI 상태 업데이트: 버튼 비활성화 및 로딩 표시
            analyzeBtn.disabled = true;
            loading.style.display = 'block';
            resultArea.style.display = 'none';

            const formData = new FormData();
            formData.append('image', imageInput.files[0]);
            formData.append('question', questionInput.value);

            try {
                // Node.js 서버의 /analyze 엔드포인트 호출
                const response = await axios.post('/analyze', formData, {
                    headers: { 'Content-Type': 'multipart/form-data' }
                });

                // 결과 출력
                resultArea.style.display = 'block';
                resultText.innerText = JSON.stringify(response.data, null, 2);
            } catch (error) {
                console.error('Error:', error);
                alert('분석 중 오류가 발생했습니다.');
            } finally {
                // UI 상태 복구
                analyzeBtn.disabled = false;
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
